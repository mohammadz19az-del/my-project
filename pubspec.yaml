name: tesla_org
description: Tesla.org - cross-platform messaging account and campaign management (Windows and Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version is pinned by flutter_localizations
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3 # desktop (Windows) SQLite via FFI, also used by tests
  sqlite3_flutter_libs: ^0.5.24 # bundles sqlite3 for Windows
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2 # OS-backed secret storage (Android Keystore / Windows)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
